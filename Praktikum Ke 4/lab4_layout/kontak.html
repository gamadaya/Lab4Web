<body>
    <div id="container">
        <header>
            <h1>Gama Daya Laksana</h1>
        </header>
        
        <nav>
            <a href="home.html">Home</a>
            <a href="artikel.html">Artikel</a>
            <a href="about.html">About</a>
            <a href="kontak.html" class="active">Kontak</a>
        </nav>

        <section id="main-single">
            <h2>Hubungi Saya</h2>
            <hr class="divider" />

            <div class="contact-info">
                <p><strong>Email:</strong> gamadaya123@gmail.com</p>
                <p><strong>No. Telepon / WA:</strong> 081234567890</p>
                <p><strong>Lokasi:</strong> Universitas Pelita Bangsa, Cikarang, Bekasi</p>
            </div>

            <form action="" method="post" class="contact-form">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email Anda" required>
                </div>

                <div class="form-group">
                    <label for="subjek">Subjek Pesan</label>
                    <input type="text" id="subjek" name="subjek" placeholder="Masukkan subjek pesan">
                </div>

                <div class="form-group">
                    <label for="pesan">Pesan / Message</label>
                    <textarea id="pesan" name="pesan" rows="6" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
                </div>

                <button type="submit" class="btn btn-large" style="border:none; cursor:pointer;">Kirim Pesan &raquo;</button>
            </form>
        </section>

        <footer>
            <p>&copy; 2026 - Gama Daya Laksana | Universitas Pelita Bangsa</p>
        </footer>
    </div>
